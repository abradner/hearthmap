# Example device: the fictional flat (../config.json) on a Guition JC8012P4A1.
#
# Build from the repository root (the component is referenced as a local path here; a real
# device would use `source: github://abradner/hearthmap@<tag>`):
#   cp examples/flat/esphome/secrets.example.yaml examples/flat/esphome/secrets.yaml
#   esphome compile examples/flat/esphome/flat-panel.yaml

substitutions:
  device_name: "hearthmap-flat"

packages:
  board: !include board_guition_jc8012p4a1.yaml

esphome:
  name: ${device_name}
  friendly_name: "Hearthmap flat"
  min_version: 2026.11.0

external_components:
  - source:
      type: local
      path: ../../../components
    components: [hearthmap]

logger:
  level: DEBUG
  logs:
    lvgl: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The hosted C6 joins a multi-access-point network more reliably through a scan.
  fast_connect: false

time:
  - platform: homeassistant
    id: ha_time

lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touch
  rotation: ${lvgl_rotation}
  byte_order: little_endian
  # 12% of the screen (256,000 B) is the size ESPHome tries in internal RAM first (it falls back
  # to PSRAM if that fails). Measured on the panel: partial repaints 1.3-2x faster than the
  # default full-screen PSRAM buffer, a full repaint 1.2x (examples/bench/README.md, D-059).
  buffer_size: 12%
  default_font: montserrat_24
  # hearthmap draws on the active screen itself; an empty widget list stops LVGL adding its
  # default "hello world" page underneath.
  widgets: []

hearthmap:
  config: ../config.json
  photos: ../photos
  time_id: ha_time
  # Optional: times touches in the perf log (components/hearthmap/README.md, "Measuring").
  touchscreen_id: main_touch
  # Optional accelerations, both off by default (components/hearthmap/README.md, D-057, D-058):
  # blitter: ppa            # large fills, blends and copies on the ESP32-P4's PPA
  # present: true           # small animated tiles straight to the panel, skipping LVGL's refresh
  # display_id: main_display
