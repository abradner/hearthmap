# Example device: the fictional flat (../config.json) on a Guition JC8012P4A1.
#
# Build from the repository root (the component is referenced as a local path here; a real
# device would use `source: github://abradner/hearthmap@<tag>`):
#   cp examples/flat/esphome/secrets.example.yaml examples/flat/esphome/secrets.yaml
#   esphome compile examples/flat/esphome/flat-panel.yaml

substitutions:
  device_name: "hearthmap-flat"

packages:
  board: !include board_guition_jc8012p4a1.yaml

esphome:
  name: ${device_name}
  friendly_name: "Hearthmap flat"
  min_version: 2026.11.0

external_components:
  - source:
      type: local
      path: ../../../components
    components: [hearthmap]

logger:
  level: DEBUG
  logs:
    lvgl: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The hosted C6 joins a multi-access-point network more reliably through a scan.
  fast_connect: false

time:
  - platform: homeassistant
    id: ha_time

lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touch
  rotation: ${lvgl_rotation}
  byte_order: little_endian
  default_font: montserrat_24
  # hearthmap draws on the active screen itself; an empty widget list stops LVGL adding its
  # default "hello world" page underneath.
  widgets: []

hearthmap:
  config: ../config.json
  photos: ../photos
  time_id: ha_time
