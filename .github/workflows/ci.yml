# CI for hearthmap. GitHub-hosted runners only: this repo is public, and a self-hosted runner
# would run code from any pull request. Every action is pinned by commit SHA (tag in the comment).
# No path filters: every job runs on every PR (AGENTS.md §7, "a skipped job is not a passing job").
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        # core.unit fails on a zero-test-case run as well as on any failed assertion. -V prints
        # doctest's summary line, so the log shows how many cases and assertions actually ran.
        run: ctest --test-dir build -V --output-on-failure --no-tests=error

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the pinned validator
        run: python -m pip install --disable-pip-version-check -r schema/requirements.txt
      - name: Validate example configs and readings fixtures
        run: python schema/validate.py
      - name: Negative controls (mutations the schema must reject)
        run: python schema/test_schema.py

  calibrate:
    name: calibrate (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/calibrate/requirements-dev.txt
      - name: Test
        # pytest exits 5 when it collects nothing, so an empty run is red, not green.
        working-directory: tools/calibrate
        run: python -m pytest -v

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install clang-format 19.1.7
        run: python -m pip install --disable-pip-version-check clang-format==19.1.7
      - name: Check formatting
        run: |
          clang-format --version
          files=$(git ls-files '*.h' '*.hpp' '*.c' '*.cpp')
          if [ -z "$files" ]; then echo "no C/C++ files found: refusing to pass vacuously"; exit 1; fi
          echo "$files" | xargs clang-format --dry-run --Werror

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        # vitest exits non-zero when it finds no test files, so an empty run cannot pass.
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke test
        run: npm run e2e
      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            editor/playwright-report/
            editor/test-results/
          retention-days: 7
