# CI for hearthmap. GitHub-hosted runners only: this repo is public, and a self-hosted runner
# would run code from any pull request. Every action is pinned by commit SHA (tag in the comment).
# No path filters: every job runs on every PR (AGENTS.md §7, "a skipped job is not a passing job").
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        # core.unit fails on a zero-test-case run as well as on any failed assertion. -V prints
        # doctest's summary line, so the log shows how many cases and assertions actually ran.
        run: ctest --test-dir build -V --output-on-failure --no-tests=error

  # ui_lvgl, the host renderer and the golden images. Both compilers must produce the very same
  # pixels as the committed goldens (rendered on Apple clang/arm64): that is the determinism
  # claim, checked on every PR.
  ui-host:
    name: ui-host (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DHEARTHMAP_BUILD_UI=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test (core, ui_lvgl, host, goldens)
        run: ctest --test-dir build -V --output-on-failure --no-tests=error
      - name: Upload actual and diff images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-out-${{ matrix.compiler }}
          path: build/golden-out/
          if-no-files-found: ignore

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the pinned validator
        run: python -m pip install --disable-pip-version-check -r schema/requirements.txt
      - name: Validate example configs and readings fixtures
        run: python schema/validate.py
      - name: Negative controls (mutations the schema must reject)
        run: python schema/test_schema.py

  calibrate:
    name: calibrate (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/calibrate/requirements-dev.txt
      - name: Test
        # pytest exits 5 when it collects nothing, so an empty run is red, not green.
        working-directory: tools/calibrate
        run: python -m pytest -v

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install clang-format 19.1.7
        run: python -m pip install --disable-pip-version-check clang-format==19.1.7
      - name: Check formatting
        run: |
          clang-format --version
          files=$(git ls-files '*.h' '*.hpp' '*.c' '*.cpp')
          if [ -z "$files" ]; then echo "no C/C++ files found: refusing to pass vacuously"; exit 1; fi
          echo "$files" | xargs clang-format --dry-run --Werror

  # The ESPHome component's generator (components/hearthmap/hearthmap_codegen.py): schema checker
  # held to the reference validator, defaults and present bits, photo conversion, the library
  # copy, and C++ checks that link core's real validate() against generated tables.
  component-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r components/hearthmap/tests/requirements.txt
      - name: pytest
        env:
          # Fail, rather than skip, the C++ tests that need core's implementation.
          HEARTHMAP_REQUIRE_CORE: "1"
          CXX: g++
        run: python -m pytest -v components/hearthmap/tests

  # `esphome config` on the example device with the pinned ESPHome image: the component's YAML
  # schema, the build-time config and photo checks, and every other component in the example.
  # A full compile is a separate, manual workflow (esphome-compile.yml).
  esphome-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Placeholder secrets
        run: cp examples/flat/esphome/secrets.example.yaml examples/flat/esphome/secrets.yaml
      - name: esphome config
        run: |
          docker run --rm -v "$PWD":/config \
            ghcr.io/esphome/esphome:2026.11.0@sha256:6351ae811202064bb3eb49dde982609b47acd523103a66d7b9c5c1431beea055 \
            config examples/flat/esphome/flat-panel.yaml
      - name: A broken config fails the same command (negative control)
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("examples/flat/config.json")
          d = json.loads(p.read_text())
          d["pins"][0]["position"] = [0.5, 2]
          p.write_text(json.dumps(d))
          PY
          if docker run --rm -v "$PWD":/config \
              ghcr.io/esphome/esphome:2026.11.0@sha256:6351ae811202064bb3eb49dde982609b47acd523103a66d7b9c5c1431beea055 \
              config examples/flat/esphome/flat-panel.yaml; then
            echo "esphome config accepted a config with a position outside 0..1"; exit 1
          fi
          git checkout -- examples/flat/config.json
